<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VISHV BOOK PUBLICATION | Dashboard</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #123b70;
    color: white;
    padding: 22px 15px;
    text-align: center;
}

header h1 {
    font-size: 23px;
    margin-bottom: 7px;
}

header p {
    font-size: 13px;
}

.container {
    width: 92%;
    max-width: 650px;
    margin: 20px auto;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

.card h2 {
    color: #123b70;
    font-size: 19px;
    margin-bottom: 15px;
}

.row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid #e5e7eb;
}

.row:last-child {
    border-bottom: none;
}

.label {
    color: #64748b;
    font-size: 14px;
}

.value {
    text-align: right;
    font-size: 14px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.amount-card {
    background: #123b70;
    color: white;
    text-align: center;
    padding: 23px 15px;
    border-radius: 12px;
    margin-bottom: 18px;
}

.amount-card p {
    font-size: 14px;
}

.amount-card h2 {
    color: white;
    font-size: 30px;
    margin-top: 10px;
}

.badge {
    display: inline-block;
    background: #fff3cd;
    color: #8a5a00;
    padding: 6px 10px;
    border-radius: 5px;
    font-size: 12px;
    margin-top: 10px;
}

.notice {
    background: #eff6ff;
    border-left: 4px solid #2563eb;
    padding: 12px;
    font-size: 13px;
    line-height: 1.6;
    border-radius: 5px;
}

.qr-placeholder {
    text-align: center;
    padding: 15px;
}

.qr-placeholder img {
    width: 100%;
    max-width: 280px;
    height: auto;
    border: 1px solid #ddd;
    border-radius: 8px;
}

button {
    background: #1677d2;
    color: white;
    padding: 13px;
    border: none;
    width: 100%;
    border-radius: 7px;
    font-size: 15px;
    margin-top: 12px;
    cursor: pointer;
}

footer {
    text-align: center;
    color: #64748b;
    font-size: 12px;
    padding: 20px;
    line-height: 1.7;
}

@media(max-width: 380px) {
    .row {
        gap: 8px;
    }

    .label, .value {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>V
